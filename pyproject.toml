[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-fragments"
version = "0.4.0"
description = "A Modular Cognitive Model for Solving Complex Problems Based on Memory Fragments (V2)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Francesco Bulla", email = "fra150@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["cognitive-model", "memory-fragments", "retrieval", "governance", "ai"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
embedding = [
    "sentence-transformers>=2.2.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
]
all = [
    "memory-fragments[dev,embedding,llm]",
]

[project.urls]
Homepage = "https://github.com/fra150/memory-fragments"
Repository = "https://github.com/fra150/memory-fragments.git"
Documentation = "https://github.com/fra150/memory-fragments#readme"
"Bug Tracker" = "https://github.com/fra150/memory-fragments/issues"
"Zenodo V1" = "https://doi.org/10.5281/zenodo.14534720"
"Zenodo V2" = "https://doi.org/10.5281/zenodo.17069503"

[project.scripts]
memory-fragments = "memory_fragments.cli:main"

[tool.setuptools]
# Flat-layout: the repository root IS the ``memory_fragments`` package.
# (legacy v0.1.0 is excluded — it lives under ``archive/legacy/``.)
package-dir = {"memory_fragments" = "."}
packages = [
    "memory_fragments",
    "memory_fragments.archive",
    "memory_fragments.calibration",
    "memory_fragments.engine",
    "memory_fragments.governance",
    "memory_fragments.library",
    "memory_fragments.models",
    "memory_fragments.retrieval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | memory-fragments
  | archive
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["memory-fragments", "archive"]
